[package]
name = "project-host-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# Pure safe Rust with no FFI of our own, which is the only option compatible
# with the workspace's `unsafe_code = "forbid"`. Only the two feature groups the
# scan actually reads are enabled; network and user enumeration are not wanted.
sysinfo = { version = "0.36.1", default-features = false, features = [
    "system",
    "disk",
] }
thiserror = "2.0.19"
# `process` for spawning a project, `time` for the grace period a stop waits
# out. No runtime features: this crate spawns onto whoever's runtime called it.
tokio = { version = "1.53.1", features = ["process", "time"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time"] }
