[package]
name = "project-host-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Version ordering is the whole decision this crate makes, and the subtle part
# — that `1.4.0-beta.1` sorts above `1.3.0` but below `1.4.0` — is exactly what
# a hand-rolled comparison gets wrong.
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.151"
