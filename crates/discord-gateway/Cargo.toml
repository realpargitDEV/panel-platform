[package]
name = "project-host-discord-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
project-host-api-types = { version = "0.1.0", path = "../api-types" }
project-host-discord = { version = "0.1.0", path = "../discord" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
twilight-gateway = { version = "0.16", default-features = false, features = ["rustls-platform-verifier", "rustls-ring", "zlib-stock"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
