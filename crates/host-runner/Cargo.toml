[package]
name = "project-host-host-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# For process groups only. This crate stays independent of docker-manager and
# api-types, but ending a process tree is an operating-system difference, and
# those live in `platform` and nowhere else.
project-host-platform = { version = "0.1.0", path = "../platform" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["process", "io-util", "fs", "sync", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "fs",
    "sync",
    "time",
] }
