id = "python"
display_name = "Python"
description = "Python applications, Discord bots, REST APIs and workers."

package_managers = ["PIP", "POETRY", "UV", "PIPENV", "NONE"]
default_package_manager = "PIP"

# `python <entry>` or `python -m <module>`. Both assembled from validated parts.
start_forms = ["entry_file", "module"]

development_scripts = []

working_dir = "/app"
default_port = 8000

[[versions]]
version = "3.13"
base_image = "python:3.13.2-slim-bookworm"
lts = true
default = true

[[versions]]
version = "3.12"
base_image = "python:3.12.9-slim-bookworm"
lts = true
default = false

[install_commands]
PIP = ["pip", "install", "--no-cache-dir", "-r", "requirements.txt"]
POETRY = ["poetry", "install", "--no-root", "--only", "main"]
UV = ["uv", "sync", "--frozen", "--no-dev"]
PIPENV = ["pipenv", "install", "--deploy"]

[build_commands]

[health_check]
supported = ["NONE", "HTTP", "TCP"]
default = "NONE"
