id = "static-site"
display_name = "Static website"
description = "HTML, CSS and JavaScript, including sites built by Vite or similar."

package_managers = ["PNPM", "NPM", "YARN", "NONE"]
default_package_manager = "NONE"

start_forms = ["nginx"]
development_scripts = []

working_dir = "/usr/share/nginx/html"
default_port = 8080

# nginx unprivileged: already runs as non-root and listens above 1024, so it
# fits the same hardening as every other template without special cases.
[[versions]]
version = "1.27"
base_image = "nginxinc/nginx-unprivileged:1.27.4-alpine"
lts = true
default = true

# A build step may need Node; the served output never does.
[[build_versions]]
version = "22"
base_image = "node:22.14.0-bookworm-slim"
lts = true
default = true

[install_commands]
PNPM = ["pnpm", "install", "--frozen-lockfile"]
PNPM_NO_LOCKFILE = ["pnpm", "install"]
NPM = ["npm", "ci"]
NPM_NO_LOCKFILE = ["npm", "install"]
YARN = ["yarn", "install", "--frozen-lockfile"]

[build_commands]
PNPM = ["pnpm", "run", "build"]
NPM = ["npm", "run", "build"]
YARN = ["yarn", "run", "build"]

[health_check]
supported = ["NONE", "HTTP", "TCP"]
default = "HTTP"
