name: CI

# `pnpm verify` is the same gate the project already runs by hand: contracts,
# rustfmt, clippy under `-D warnings`, the Rust tests, tsc, ESLint, Prettier and
# the TypeScript tests. Running it here means a release is cut from a tree that
# something other than one laptop has checked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Cheap, and runs before anything expensive: a BOM in a manifest builds
      # and tests fine here, then fails the release job that parses it.
      - name: No file starts with a BOM
        shell: bash
        run: bash scripts/check-no-bom.sh

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Versions agree across the tree
        shell: bash
        run: bash scripts/check-version.sh

      # Caught here rather than only at tag time: the notes grow a section per
      # release, and finding out they are too long while cutting a release is
      # finding out too late.
      - name: Release notes fit what installed clients accept
        shell: bash
        run: bash scripts/check-release-notes.sh

      - run: pnpm verify
