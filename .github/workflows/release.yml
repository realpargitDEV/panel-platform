name: Release

# Pushing a `v*` tag builds installers for every supported platform and attaches
# them to a draft release, together with the `latest.json` the in-app updater
# reads. The release is a draft on purpose: nothing reaches users until someone
# has looked at the artefacts and pressed publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  # Cheap gate. A tag that disagrees with the version in the tree produces a
  # release whose installers announce a different version than their filename,
  # and the updater compares versions — so this fails the run in seconds rather
  # than shipping the confusion.
  check-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match tauri.conf.json, Cargo.toml and package.json
        run: bash scripts/check-version.sh "${{ github.event.inputs.tag || github.ref_name }}"
      # `tauri-action` parses these manifests with a TOML reader that rejects a
      # BOM. Failing here costs seconds; failing in the build costs the whole
      # matrix.
      - name: No file starts with a BOM
        run: bash scripts/check-no-bom.sh

  build:
    needs: check-version
    strategy:
      # One platform failing should not cancel the others: a broken Linux build
      # is worth knowing about at the same time as a working Windows one.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # 22.04 rather than 24.04: the glibc a binary is built against is the
          # oldest it can run on, and webkit2gtk-4.1 is packaged here.
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artefacts. Without these the build still produces
          # installers, but `latest.json` would carry no usable signature and
          # every client would reject the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Panel Platform __VERSION__'
          # GitHub always appends "Source code (zip/tar.gz)" to a release and
          # that cannot be turned off. So the installers are named first and
          # explicitly, and the source archives are named as what they are —
          # otherwise the two most prominent links on the page are the two
          # nobody wanting to *use* the application should click.
          releaseBody: |
            ## What changed in 0.1.12

            **The interface has been designed rather than assembled.** The
            sidebar head is rebuilt around the real Panel Platform mark, with
            the workspace name, an overflow menu and a primary action on its
            own band. The blue is not the old accent: white on that accent
            measured 3.68:1 and failed WCAG AA at 13px, so the gradient used
            here was chosen against the measurement.

            **Themes, accents, density, text size and motion.** Five themes and
            six accents driven by a `data-theme` attribute over the token set,
            so switching one re-paints without re-rendering and no component
            knows which theme is on. Motion runs off a single scale variable —
            reduced is 40%, off collapses to near-zero — and the operating
            system's reduced-motion preference can veto full motion but can
            never force motion on.

            **Every project has a designed mark instead of a letter in a box.**
            The glyph says what the project is, so the shape becomes learnable
            across every Node project; the colour says which project it is,
            derived from the id so the same project is the same colour in the
            list, the header and the switcher — on every machine, after every
            reinstall, with nothing stored and nothing to migrate.

            **47 icons redrawn as one set**, against one live area and one
            stroke weight, with fill reserved for the two transport controls
            whose state has to read instantly.

            **The two settings that remembered their position and did nothing
            now do something.** Project state changes are announced only on
            transition, never on first load, so opening the window does not
            toast once per running project. Developer mode shows the
            identifiers a bug report needs, selectable.

            **The update manager is one window.** The update used to be drawn
            in three places — a banner, a panel in Settings and a button in the
            editor title bar — each with its own idea of the same install. It
            is now a single window with a stage rail (Download, Verify,
            Install, Finish), and percentage, size, transfer rate and time
            remaining beside it. Every figure is derived from bytes the core
            actually reported, and each shows nothing rather than a guess when
            the data cannot support one. Restart and Minimise are real commands
            now, so a long download can be put aside and the new version can
            start itself.

            **There is still no pause and no cancel, and that is not an
            oversight.** The updater downloads, verifies and installs in one
            uninterruptible call. Offering either button would mean replacing
            it with a downloader of our own that re-implements signature
            verification against the compiled-in key — a weaker security path
            bought for a button. Close is disabled, rather than hidden, while
            closing would cost the download or leave a half-written
            application.

            The new update window has not been exercised against a real
            download from a published release; that needs this release to
            exist first.

            This release also carries everything in 0.1.11, below.

            ## What changed in 0.1.11

            **The application looks at the machine it was installed on.** A
            compatibility scan probes CPU, memory, storage volumes, operating
            system identity, virtualization, WSL and GPU, tiers the machine
            from what it found, and derives resource defaults for new projects
            from that tier rather than from a fixed guess. Where no Docker
            artefact applies to a machine, it says which one and why instead of
            offering a download that cannot work.

            **A missing language runtime is now offered rather than reported.**
            Starting a project checks the toolchain it needs — on every start
            path, not one — and offers to install what is missing.

            This release also carries everything in 0.1.10, below.

            ## What changed in 0.1.10

            **Imports now handle real project-shaped drops.** When files,
            folders or complete project directories are brought into a
            workspace, the desktop app can group them, detect likely project
            roots, unwrap project folders when that is the safer landing shape,
            and show the destination plan before anything is copied.

            **Conflicts are resolved instead of guessed.** Existing files and
            folders now get an explicit dialog with replace, keep both, skip and
            relocation choices, backed by a transactional import path so failed
            or cancelled work rolls back cleanly.

            **Selection and organiser polish.** Explorer selection now supports
            range selection, rubber-band selection and clipboard-style copy/cut
            handling, while the import organiser and progress UI make multi-item
            imports easier to review and cancel.

            This release also carries everything in 0.1.9, below.

            ## What changed in 0.1.9

            **The interface has been rebuilt.** The four dashboard-style
            screens and the two-pane file view are gone, replaced by a
            project-hosting interface and a proper editor workspace.

            **A dashboard that reports the machine.** Live CPU, memory and disk
            for the computer the projects run on, measured rather than
            estimated, alongside project counts, an activity feed and a list of
            anything that should be running and is not.

            **Projects you can find.** Grid and list views, search, filters by
            status and runtime, sorting, and start/stop/restart without opening
            the project first.

            **A project page with everything the application knows.** Seven
            tabs — state, runtime and commands, deployments, container events,
            ports, environment variables and limits. Most of this was already
            recorded and had never been shown: uptime, restart counts, exit
            codes, failure reasons, port mappings and build history all come
            from the database as it stands.

            **Creating a project is a four-step wizard.** Source, details,
            runtime, review. What you type survives changing your mind about
            where the files come from, errors appear next to the field that
            caused them, and the review step tells you what will be detected
            rather than making you guess.

            **An editor that behaves like one.** A file tree with drag-and-drop
            move and import, tabs with unsaved markers, Monaco with a minimap
            and find-and-replace, a command palette, and the usual shortcuts.
            Dropping a file that already exists now offers to replace, keep
            both or skip, instead of failing.

            **Activity.** Every start, stop, edit and failure the core recorded,
            grouped by day and filterable.

            Where the application cannot answer a question it now says so
            rather than showing a convincing zero. Per-project CPU and memory
            are not measured, there is no console or log collection, and
            configuration is still read from `config.toml` at startup.

            This release also carries everything in 0.1.7, below.

            ## What changed in 0.1.7

            **Dragging files and folders from your computer now imports them
            reliably.** The file manager handles individual files, multiple
            files, folders and complete project directories dropped from the
            operating system, preserving nested subfolders and refreshing the
            Explorer as soon as the import completes.

            Imports are staged before they appear in the project, so cancelled
            or failed transfers do not leave partially copied files behind. The
            app now shows progress, supports cancel and retry, refuses accidental
            overwrites or duplicate destinations, and reports clear errors for
            paths it cannot safely copy.

            This release also carries everything in 0.1.6, below.

            ## What changed in 0.1.6

            **Project consoles now have direct runtime controls.** Every
            project console includes Start, Restart, Stop and Kill buttons like
            the server control strip, with clear disabled states while Docker is
            unavailable or the project is already changing state.

            Stop still asks the container to shut down gracefully. Kill is a new
            immediate Docker kill path for cases where the process is wedged,
            and it leaves project files and volumes untouched.

            This release also carries everything in 0.1.5, below.

            ## What changed in 0.1.5

            **The file manager now accepts drag-and-drop uploads.** Drop files
            or folders onto the Explorer, choose the directory they should land
            in, and the application streams each file into place with visible
            progress. Multiple files can upload at once, failed transfers can be
            retried, and in-progress uploads can be cancelled without leaving a
            partial project file behind.

            Uploads now protect existing project files. A dropped file is first
            reserved as a hidden temporary sibling, written in chunks, and only
            renamed into its final path after the upload is complete. If the
            destination already exists at the start, or appears while the upload
            is running, the upload fails clearly instead of overwriting the
            user's work.

            0.1.5 also carries everything in 0.1.4, below.

            ## What changed in 0.1.4

            **The Update button now works, start to finish.** Pressing it
            downloads the release for your system, checks its signature against
            a key built into the application, installs it, and starts the new
            version. While that happens the window shows how much has arrived
            of how much, then that it is verifying, then that it is installing —
            rather than a button that says "Updating…" and nothing else.

            The bug that made the progress bar sit still was found by running a
            real update rather than by reading the code: the window was never
            permitted to receive events from the core at all, so every progress
            report was dropped on the floor. That permission is part of this
            release.

            **The application now looks for updates on its own** — once when it
            starts and every six hours while it is open — and the Update button
            is still there for asking immediately. Only one update can be
            running at a time, enforced in the core rather than by hoping two
            buttons in two places disagree politely.

            What counts as an update has not changed and is worth being explicit
            about: only a **published, stable release** newer than the one you
            are running. Commits, tags, branches and draft releases are all
            invisible to it, and a pre-release is only ever offered on the beta
            channel.

            Your projects, settings and database are untouched by an update. The
            installer replaces the application; your data lives elsewhere and
            stays where it is.

            This release also carries everything in 0.1.3, below.

            ## What changed in 0.1.3

            **Creating a project no longer fails with "Value rejected by a
            database constraint."**

            0.1.0 — until now the only release anyone could install — wrote a
            project type into the database that the schema does not allow, so
            *every* attempt to create a project was refused and nothing was
            saved. The column now takes a typed value rather than free text, so
            the wrong word cannot be written at all, and the whole creation path
            — all thirteen runtimes and every source kind — is covered by tests
            that go through the code the Create button uses rather than through
            values a test made up.

            The code fix was ready in 0.1.2, but 0.1.1 and 0.1.2 were both left
            as unpublished drafts, so no one ever received them. That is the
            other half of this release: it is published.

            The same mistake was found and fixed in one more place before it
            could reach anyone: the status and health a project gets after
            starting were passed through in Docker's spelling (`healthy`), which
            the database also refuses. Those columns are typed now too.

            Your existing data is kept. This release changes no table and adds
            no migration; a database from an earlier version opens, upgrades and
            keeps its projects, runtimes and environment variables.

            **0.1.0 and 0.1.1 cannot update themselves** — their Update button
            does nothing. If you are on one of those, install this release by
            hand, once, using the instructions below. Updating from 0.1.2 works
            from inside the application.

            ## Download

            **Pick one of the installers below — you do not need to download
            the source code, clone anything, or install any development
            tools.** The "Source code" archives at the bottom of this list are
            added by GitHub automatically and are only useful if you intend to
            build the application yourself.

            **If you would rather not choose**, download the setup program for
            your system. It works out which of the files below you need, checks
            it against Panel Platform's signature, and starts the installer.

            | Your system | Setup program |
            | --- | --- |
            | Windows 10 / 11 (64-bit) | `PanelPlatformSetup.exe` |
            | 64-bit Linux | `panel-platform-setup-x86_64` |

            Or pick a file yourself:

            | Your system | Download this | |
            | --- | --- | --- |
            | **Windows 10 / 11** (64-bit) | `Panel.Platform_*_x64-setup.exe` | **Recommended** |
            | Windows, for deployment tooling | `Panel.Platform_*_x64_en-US.msi` | Group Policy, Intune |
            | **Debian / Ubuntu** | `Panel.Platform_*_amd64.deb` | **Recommended** |
            | Any other 64-bit Linux | `Panel.Platform_*_amd64.AppImage` | Portable, self-updating |

            ## Installing

            **Windows** — run the `-setup.exe` and follow the prompts. It
            installs the WebView2 runtime if your machine does not already have
            it. The application appears in the Start Menu as *Panel Platform*.

            **Debian / Ubuntu**

            ```bash
            sudo apt install ./Panel.Platform_*_amd64.deb
            ```

            **Other Linux**

            ```bash
            chmod +x Panel.Platform_*_amd64.AppImage
            ./Panel.Platform_*_amd64.AppImage
            ```

            ## What you need

            Nothing is required to *install* or *open* the application — no
            Node.js, no Rust, no pnpm, no toolchain of any kind. Everything it
            needs is inside the installer.

            **Docker is required to actually run projects**, because a project
            runs in a container. The application installs and opens without
            Docker and tells you it is missing, rather than failing at launch.
            Install [Docker Desktop](https://www.docker.com/products/docker-desktop/)
            on Windows, or Docker Engine on Linux.

            ## These builds are not code-signed

            There is no signing certificate yet, and saying so plainly beats
            letting you discover it:

            - **Windows** shows a SmartScreen warning on first run. Choose
              **More info**, then **Run anyway**.
            - **Linux** packages carry no repository signature.

            `SHA256SUMS.txt` is attached. To check what you downloaded:

            ```powershell
            # Windows
            Get-FileHash .\<file> -Algorithm SHA256
            ```

            ```bash
            # Linux
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            ## Updates

            The application checks for new releases and offers them; nothing
            installs until you press the button. Downloads are verified against
            a signing key built into the application, not one supplied by the
            release feed. The `.deb` cannot update itself — dpkg owns those
            files — so upgrade it by installing the next `.deb`.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The setup program: a small binary that downloads the right installer from
  # this release, verifies it, and starts it. Built after `build` rather than
  # beside it only because the draft release it uploads into does not exist
  # until `tauri-action` creates it.
  bootstrap:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            binary: panel-platform-setup.exe
            asset: PanelPlatformSetup.exe
          - platform: ubuntu-22.04
            binary: panel-platform-setup
            asset: panel-platform-setup-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # eframe on the glow backend. Deliberately *not* webkit2gtk: this program
      # runs before the application is installed, so it may not depend on
      # anything the .deb exists to provide.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Build
        run: cargo build --release -p panel-platform-setup

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "target/release/${{ matrix.binary }}" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The real path, against the real artefacts, over the real network:
      # resolve the latest release, download it, check its signature and its
      # checksum, and stop before installing anything.
      #
      # It reads the *latest published* release, which is not the draft this
      # run just built. Until a release is published there is nothing to read,
      # and the step says so rather than reporting a green it did not earn.
      - name: Verify it can resolve, download and check a real release
        shell: bash
        run: |
          set -uo pipefail
          output=$(./"${{ matrix.asset }}" --dry-run 2>&1) && code=0 || code=$?
          echo "$output"

          if [ $code -eq 0 ]; then
            echo "Verified a published release end to end."
            exit 0
          fi

          if echo "$output" | grep -q "no published release yet"; then
            echo "::warning::No release is published yet, so only the error"
            echo "::warning::path was exercised. This step will verify a real"
            echo "::warning::download once a release has been published."
            exit 0
          fi

          echo "::error::The setup program failed against the published release."
          exit 1

  # Checksums are only meaningful once every platform's assets exist, so this
  # runs after the matrix rather than inside it. It must also wait for
  # `bootstrap`, or SHA256SUMS.txt would silently omit the two artefacts most
  # in need of a checksum.
  checksums:
    needs: [build, bootstrap]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compute SHA-256 for every attached asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' || true
          if [ -z "$(ls -A)" ]; then
            echo "No assets found on $TAG" >&2
            exit 1
          fi
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  # Smoke tests. These install the artefacts the release actually carries —
  # downloaded from the draft release, never rebuilt — and prove two things
  # only: that the package installs, and that the application starts and stays
  # up. They say nothing about whether any feature works.
  smoke-linux:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Install a desktop runtime for the application to start against
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libgtk-3-0 \
            libayatana-appindicator3-1 dbus-x11

      - name: Download the release artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artefacts && cd artefacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' --pattern '*.AppImage'
          ls -lh

      - name: Install the .deb
        run: |
          set -euo pipefail
          cd artefacts
          deb="$(ls *.deb | head -n 1)"
          echo "Installing $deb"
          # `dpkg -i` fails rather than resolving dependencies; `apt-get -f`
          # is the documented repair step and is what a user hitting this
          # would run.
          sudo dpkg -i "$deb" || sudo apt-get install -f -y
          # Read the package name from the archive rather than assuming it:
          # it derives from productName and would change with it.
          pkg="$(dpkg-deb -f "$deb" Package)"
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: Verify the package is installed
        run: |
          set -euo pipefail
          dpkg -s "$PKG"
          dpkg -s "$PKG" | grep -q '^Status: install ok installed'
          echo "Files installed:"
          dpkg -L "$PKG"
          bin="$(dpkg -L "$PKG" | grep -E '^/usr/bin/' | head -n 1)"
          test -x "$bin"
          echo "BIN=$bin" >> "$GITHUB_ENV"

      - name: Launch the installed application under xvfb
        run: |
          set -uo pipefail
          mkdir -p logs
          echo "Launching $BIN"
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            "$BIN" > logs/deb-launch.log 2>&1 &
          pid=$!
          # Ten seconds is enough to distinguish "started" from "died on
          # startup", which is the only distinction this test is entitled to
          # make.
          for i in $(seq 1 10); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; code=$?
              echo "::error::The .deb application exited after ${i}s with code $code"
              echo "--- output ---"; cat logs/deb-launch.log
              exit 1
            fi
          done
          echo "Still running after 10s."
          kill "$pid" 2>/dev/null || true
          cat logs/deb-launch.log

      - name: Launch the AppImage under xvfb
        run: |
          set -uo pipefail
          mkdir -p logs
          cd artefacts
          app="$(ls *.AppImage | head -n 1)"
          chmod +x "$app"
          echo "Launching $app"
          # No FUSE on the runner, so the AppImage is extracted and its inner
          # entry point run — the same binary, without needing a kernel module.
          ./"$app" --appimage-extract > /dev/null 2>&1
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            ./squashfs-root/AppRun > ../logs/appimage-launch.log 2>&1 &
          pid=$!
          for i in $(seq 1 10); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; code=$?
              echo "::error::The AppImage exited after ${i}s with code $code"
              echo "--- output ---"; cat ../logs/appimage-launch.log
              exit 1
            fi
          done
          echo "Still running after 10s."
          kill "$pid" 2>/dev/null || true
          cat ../logs/appimage-launch.log

      - name: Upload launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux-logs
          path: logs/
          if-no-files-found: warn

  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download the release artefacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p artefacts && cd artefacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-setup.exe'
          ls -l

      - name: Install silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem artefacts\*-setup.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name)"
          # /S is NSIS's silent switch. Per-user, so no elevation is needed.
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }

      - name: Verify the installation directory and executable exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The install location is not assumed: it is found, so a change to
          # productName does not silently turn this check into a no-op.
          $roots = @(
            "$env:LOCALAPPDATA\Panel Platform",
            "$env:ProgramFiles\Panel Platform",
            "${env:ProgramFiles(x86)}\Panel Platform"
          )
          $dir = $roots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { throw "No installation directory found. Looked in:`n$($roots -join "`n")" }
          Write-Host "Installed to $dir"
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize

          $exe = Get-ChildItem -Path $dir -Filter *.exe -Recurse |
                 Where-Object { $_.Name -notmatch 'uninstall' } |
                 Select-Object -First 1
          if (-not $exe) { throw "No application executable under $dir" }
          Write-Host "Executable: $($exe.FullName)"
          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Launch it and confirm it stays running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Write-Host "Launching $env:APP_EXE"
          $p = Start-Process -FilePath $env:APP_EXE `
                 -RedirectStandardOutput logs\win-launch.out.log `
                 -RedirectStandardError  logs\win-launch.err.log `
                 -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "::error::The application exited after less than 10s with code $($p.ExitCode)"
            Get-Content logs\win-launch.out.log -ErrorAction SilentlyContinue
            Get-Content logs\win-launch.err.log -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Still running after 10s."
          Stop-Process -Id $p.Id -Force
          Get-Content logs\win-launch.out.log -ErrorAction SilentlyContinue
          Get-Content logs\win-launch.err.log -ErrorAction SilentlyContinue

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          $un = Get-ChildItem -Path $env:APP_DIR -Filter '*ninstall*.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if ($un) {
            Write-Host "Uninstalling with $($un.FullName)"
            Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait
          } else {
            Write-Host "No uninstaller found; nothing to do."
          }

      - name: Upload launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-logs
          path: logs/
          if-no-files-found: warn

  # A single place to read whether the draft is fit to publish. It does not
  # publish anything: a person still presses the button, and this only records
  # that every gate before it went green.
  release-gate:
    needs: [build, bootstrap, checksums, smoke-linux, smoke-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Report
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "Builds, checksums and both smoke tests passed for $TAG."
          echo
          echo "The release is still a DRAFT. Publishing is manual and deliberate."
          echo "These tests prove the installers install and the application"
          echo "starts without immediately crashing. They do NOT prove that any"
          echo "feature works — see docs/installers.md for what still needs a VM."
