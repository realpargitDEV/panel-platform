name: Diagnose Linux

# TEMPORARY. Delete before this branch merges.
#
# `verify` dies on ubuntu-22.04 with "the runner has received a shutdown
# signal" roughly five minutes in, always inside `project-host-core`, and
# always with an `sh`/`sleep` pair left as orphans. Windows passes the same
# gate. `main` passes on both, so it arrived with this branch.
#
# Two hypotheses, and this job is built to tell them apart:
#
#   1. A test signals the wrong process group. `crates/platform/src/process.rs`
#      signals a *negated* pid, which addresses a group rather than a process,
#      and every Unix path on this branch is unproven. If the negation lands on
#      the runner's own group, the agent gets the SIGTERM and the job dies while
#      the project's own children survive — which is exactly what the orphan
#      list looks like.
#   2. The runner runs out of memory or disk and is reclaimed, and the orphaned
#      `sleep` is a coincidence: that test is also the slowest in the binary, so
#      it is in flight whenever the job dies for any reason at all.
#
# `--test-threads=1` decides (1): cargo prints a test's name before running it,
# so the last name in the log is the test that was executing, not merely one of
# thirty running at once. The sampler decides (2): it streams to the log every
# two seconds, so its last line survives the runner's death and says what memory
# and disk were doing at the end.

on:
  workflow_dispatch:
  push:
    branches: [theme-catalogue]

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    # A diagnostic that hangs teaches nothing and bills for six hours. The
    # previous attempt sat for half an hour: a `while true` sampler in the
    # background holds the step's stdout open, so the step cannot end even
    # once the tests have finished. Every sampler below is bounded, every
    # test run is under `timeout`, and the job is capped.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      # The group ids to compare everything against. If a later kill addresses
      # one of these, hypothesis 1 is confirmed outright.
      - name: What group is this job in
        run: |
          echo "shell pid=$$ pgid=$(ps -o pgid= -p $$ | tr -d ' ') ppid=$PPID"
          echo "session leaders and runner processes:"
          ps -eo pid,pgid,ppid,comm | grep -Ei 'runner|Runner.Worker|node|bash' | head -20
          echo "nproc=$(nproc)"
          free -m
          df -h /

      # Which `kill` gets run, and what it thinks a negative pid means. The
      # whole Unix strategy rests on `-<pid>` addressing a process group.
      - name: Which kill is this
        run: |
          echo "PATH kill: $(command -v kill)"
          /usr/bin/kill --version 2>&1 | head -2 || true

      # Round one: the platform crate signals a process tree, and its own tests
      # spawn a nested sleeper and kill it. If the runner dies here, the defect
      # is in `platform::process` alone and nothing above it is implicated.
      #
      # The sampler ticks four times a second because the previous run's
      # two-second tick never saw the child at all: it lived 0.6s. Its `pgid`
      # column is the fact the whole diagnosis turns on. If pgid == the child's
      # own pid, `process_group(0)` worked and a group kill was safe; if pgid is
      # 1818, the child never left the runner's group and signalling `-<pid>`
      # was aimed at whatever else happens to carry that id.
      # Built first, and separately, so the compile does not run inside the
      # timeout that guards the tests themselves.
      - name: Build the test binaries
        run: cargo test --no-run -p project-host-platform -p project-host-core

      - name: Round 1 — the platform crate's own tree-kill tests
        timeout-minutes: 8
        run: |
          (
            for _ in $(seq 1 1200); do
              ps -eo pid,pgid,ppid,comm | awk '$4=="sh"||$4=="sleep"||$4=="ping"{print "[PROC] pid="$1" pgid="$2" ppid="$3" "$4}'
              sleep 0.25
            done
          ) &
          sampler=$!

          set +e
          RUST_BACKTRACE=1 RUST_LOG=warn \
            timeout 240 cargo test -p project-host-platform -- --test-threads=1 --nocapture
          echo "[EXIT] platform tests exited $?"
          set -e

          kill $sampler 2>/dev/null || true
          wait $sampler 2>/dev/null || true

      # Round two: only the test that was in flight when the runner died. Runs
      # last because it is the one expected to be fatal — everything above it
      # has to have reported first.
      - name: Round 2 — only the test that was running when the runner died
        if: always()
        timeout-minutes: 8
        run: |
          (
            for _ in $(seq 1 1200); do
              ps -eo pid,pgid,ppid,comm | awk '$4=="sh"||$4=="sleep"{print "[PROC] pid="$1" pgid="$2" ppid="$3" "$4}'
              sleep 0.25
            done
          ) &
          sampler=$!

          set +e
          RUST_BACKTRACE=1 RUST_LOG=warn \
            timeout 240 cargo test -p project-host-core quitting_stops_host_projects -- --test-threads=1 --nocapture
          echo "[EXIT] app-core test exited $?"
          set -e

          kill $sampler 2>/dev/null || true
          wait $sampler 2>/dev/null || true

      - name: What the machine looked like afterwards
        if: always()
        run: |
          free -m
          df -h /
          ps -eo pid,pgid,ppid,comm | grep -E 'sh|sleep' | head -20
